<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>the world is yours.</title>
                <!-- aynen kardesim sen tamamsin -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #0a0a0a;
            color: #e5e5e5;
        }
        .handcrafted-border {
            border: 2px solid #262626;
            box-shadow: 4px 4px 0px #171717;
        }
        .btn-handcrafted {
            border: 2px solid #e5e5e5;
            box-shadow: 3px 3px 0px #e5e5e5;
            transition: all 0.15s ease-in-out;
        }
        .btn-handcrafted:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px #e5e5e5;
        }
        .btn-handcrafted:active {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0px #e5e5e5;
        }
        .btn-mono {
            border-color: #ffffff;
            box-shadow: 3px 3px 0px #ffffff;
            color: #ffffff;
        }
        .btn-mono:hover {
            box-shadow: 5px 5px 0px #ffffff;
            background-color: #ffffff;
            color: #000000;
        }

        .pyro-card {
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .pyro-card:hover {
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
        }
        .pyro-title-text {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }
        .pyro-hover-reveal {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(12px);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            background-color: #000000;
            z-index: 20;
        }
        .pyro-card:hover .pyro-title-text {
            opacity: 0;
            transform: translateY(-12px);
        }
        .pyro-card:hover .pyro-hover-reveal {
            opacity: 1;
            transform: translateY(0);
        }
        .pyro-scanline {
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            pointer-events: none;
            z-index: 15;
        }
        .pyro-card:hover .pyro-scanline {
            animation: scan 1.2s infinite linear;
        }
        @keyframes scan {
            0% { top: -100%; }
            100% { top: 100%; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-6 sm:p-10 select-none">


    <main class="w-full max-w-xl mx-auto flex flex-col items-center text-center space-y-6 my-auto py-6">
        
        <div class="space-y-3 w-full">
            <h1 class="text-3xl sm:text-5xl font-bold tracking-tight lowercase text-white">
                the world is yours.
            </h1>

            <!-- Visitor System Information Panel -->
            <div class="w-full bg-neutral-950 handcrafted-border p-4 text-left space-y-2 mt-4">
                <div class="flex items-center justify-between border-b border-neutral-800 pb-2">
                    <span class="text-[10px] font-mono text-neutral-400 uppercase tracking-widest flex items-center gap-1.5">
                        <i class="fa-solid fa-terminal text-[10px]"></i> visitor telemetry
                    </span>
                    <span class="text-[10px] font-mono text-neutral-400 flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span> LIVE
                    </span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs font-mono pt-1">
                    <div>
                        <span class="text-neutral-500 uppercase">IP ADDR:</span> 
                        <span id="ipDisplay" class="text-white font-bold ml-1">detecting...</span>
                    </div>
                    <div>
                        <span class="text-neutral-500 uppercase">PLATFORM:</span> 
                        <span id="platformDisplay" class="text-white ml-1">detecting...</span>
                    </div>
                    <div class="sm:col-span-2 border-t border-neutral-900 pt-1.5 mt-0.5">
                        <span class="text-neutral-500 uppercase">DISPLAY & TIME:</span> 
                        <span id="sysDetailsDisplay" class="text-neutral-300 ml-1">detecting...</span>
                    </div>
                </div>
            </div>
        </div>


        <div class="w-16 h-0.5 bg-neutral-800 my-1"></div>

        <div class="w-full">
            <a href="https://zero-rule.vercel.app/" 
               target="_blank" 
               rel="noopener noreferrer"
               class="btn-handcrafted inline-block w-full py-4 px-6 text-sm sm:text-base font-bold bg-neutral-900 text-white rounded-none hover:bg-neutral-800 tracking-wide uppercase">
               go uncensored the REAL AI <i class="fa-solid fa-arrow-up-right-from-square ml-2 text-xs"></i>
            </a>
        </div>

        <div class="w-full bg-neutral-950 p-6 handcrafted-border text-left space-y-4">
  
            <div class="flex items-center justify-between border-b border-neutral-800 pb-3">
                <span class="text-xs font-mono text-neutral-400 uppercase tracking-widest">
                    key: openai
                </span>
            </div>


            <button id="rentBtn" 
                    onclick="handleRentKey()"
                    class="btn-handcrafted btn-mono w-full py-3.5 px-4 text-xs sm:text-sm font-bold bg-transparent text-white rounded-none uppercase tracking-wider flex items-center justify-center">
                <i class="fa-solid fa-unlock-keyhole mr-2"></i> get a key for uncensored ai
            </button>


            <div id="keySection" class="hidden space-y-3 pt-2">
                <label class="block text-xs text-neutral-400 uppercase tracking-wider">
                    OpenAI Key for Uncensored AI Platform:
                </label>
                <div class="relative">
                    <input type="text" 
                           id="keyInput" 
                           readonly 
                           value="" 
                           class="w-full bg-black border border-neutral-700 py-2.5 px-3 pr-10 text-xs font-mono text-white focus:outline-none">
                </div>


                <button id="copyBtn" 
                        onclick="copyKeyAndRedirect()" 
                        class="btn-handcrafted w-full py-2.5 px-4 text-xs font-bold bg-white text-black hover:bg-neutral-200 uppercase tracking-wide flex items-center justify-center">
                    <i class="fa-regular fa-copy mr-2"></i> copy key & launch platform
                </button>
            </div>

            <div id="statusMessage" class="hidden text-center text-xs text-white font-semibold py-1 uppercase tracking-wider"></div>
        </div>

        <div class="w-full pt-4">
            <a href="mailto:baal@pyrollc.com.tr" 
               class="block py-7 px-6 bg-black border-2 border-neutral-800 handcrafted-border pyro-card group cursor-pointer">

                <div class="pyro-scanline"></div>


                <div class="absolute inset-0 bg-[linear-gradient(to_right,#171717_1px,transparent_1px),linear-gradient(to_bottom,#171717_1px,transparent_1px)] bg-[size:0.75rem_0.75rem] opacity-30"></div>
                

                <div class="absolute top-1.5 left-1.5 w-2 h-2 border-t-2 border-l-2 border-neutral-500 group-hover:border-white transition-colors"></div>
                <div class="absolute top-1.5 right-1.5 w-2 h-2 border-t-2 border-r-2 border-neutral-500 group-hover:border-white transition-colors"></div>
                <div class="absolute bottom-1.5 left-1.5 w-2 h-2 border-b-2 border-l-2 border-neutral-500 group-hover:border-white transition-colors"></div>
                <div class="absolute bottom-1.5 right-1.5 w-2 h-2 border-b-2 border-r-2 border-neutral-500 group-hover:border-white transition-colors"></div>

                <div class="relative z-10 flex flex-col items-center justify-center min-h-[44px]">

                    <div class="pyro-title-text text-3xl sm:text-4xl font-extrabold tracking-[0.45em] text-white uppercase select-none pl-[0.45em] py-1 drop-shadow-[0_0_12px_rgba(255,255,255,0.2)] font-mono">
                        PYROINC
                    </div>

                    <div class="pyro-hover-reveal">
                        <span class="text-xs sm:text-sm font-mono text-white font-bold tracking-widest flex items-center gap-2 uppercase">
                            <i class="fa-regular fa-envelope"></i> baal@pyrollc.com.tr
                        </span>
                    </div>
                </div>
            </a>
        </div>

    </main>


    <footer class="w-full max-w-xl text-center pt-6 border-t border-neutral-900 mt-6">
        <p class="text-xs text-neutral-500 tracking-wider uppercase">
            contact me: 
            <a href="mailto:baal@pyrollc.com.tr" class="text-neutral-300 hover:underline hover:text-white transition-colors ml-1 font-mono lowercase">
                baal@pyrollc.com.tr
            </a>
        </p>
    </footer>

    <script>
        const targetUrl = "https://zero-rule.vercel.app/";

        async function fetchTelemetry() {
            const platformElem = document.getElementById('platformDisplay');
            const sysDetailsElem = document.getElementById('sysDetailsDisplay');
            const ipElem = document.getElementById('ipDisplay');


            const userAgent = navigator.userAgent;
            let os = "Unknown OS";
            if (userAgent.indexOf("Win") !== -1) os = "Windows";
            else if (userAgent.indexOf("Mac") !== -1) os = "macOS";
            else if (userAgent.indexOf("Linux") !== -1) os = "Linux";
            else if (userAgent.indexOf("Android") !== -1) os = "Android";
            else if (userAgent.indexOf("like Mac") !== -1) os = "iOS";

            let browser = "Browser";
            if (userAgent.indexOf("Firefox") !== -1) browser = "Firefox";
            else if (userAgent.indexOf("Chrome") !== -1 && userAgent.indexOf("Edg") === -1) browser = "Chrome";
            else if (userAgent.indexOf("Safari") !== -1 && userAgent.indexOf("Chrome") === -1) browser = "Safari";
            else if (userAgent.indexOf("Edg") !== -1) browser = "Edge";

            platformElem.textContent = `${os} (${browser})`;

            const resWidth = window.screen.width;
            const resHeight = window.screen.height;
            const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
            sysDetailsElem.textContent = `${resWidth}x${resHeight} px • ${tz}`;


            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                ipElem.textContent = data.ip;
            } catch (err) {
                ipElem.textContent = "127.0.0.1 (Protected)";
            }
        }


        function generateOpenAIKey() {
            const randomHash = Array.from({length: 36}, () => 
                'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[Math.floor(Math.random() * 62)]
            ).join('');
            return `sk-proj-uncensored-openai-${randomHash}`;
        }

        function handleRentKey() {
            const rentBtn = document.getElementById('rentBtn');
            const keySection = document.getElementById('keySection');
            const keyInput = document.getElementById('keyInput');

            // Generate Key for Uncensored AI Platform
            const key = generateOpenAIKey();
            keyInput.value = key;

            // UI Toggle
            rentBtn.classList.add('hidden');
            keySection.classList.remove('hidden');
        }

        function copyKeyAndRedirect() {
            const keyInput = document.getElementById('keyInput');
            const statusMessage = document.getElementById('statusMessage');
            const copyBtn = document.getElementById('copyBtn');


            keyInput.select();
            keyInput.setSelectionRange(0, 99999);

            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(keyInput.value);
                } else {
                    document.execCommand('copy');
                }
                
                statusMessage.textContent = "[✓] Key copied! Redirecting to platform...";
                statusMessage.classList.remove('hidden');
                copyBtn.disabled = true;
                copyBtn.classList.add('opacity-50', 'cursor-not-allowed');

                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 1200);

            } catch (err) {
                document.execCommand('copy');
                statusMessage.textContent = "[✓] Key copied! Redirecting...";
                statusMessage.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 1200);
            }

        window.addEventListener('DOMContentLoaded', fetchTelemetry);
    </script>
</body>
</html>
