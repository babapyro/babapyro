<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pyroinc.</title>
  <style>
    :root {
      --bg: #000000;
      --border: #222222;
      --border-active: #777777;
      --text: #ffffff;
      --gray: #777777;
      --muted: #444444;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 3.5rem 2rem;
    }

    /* Header */
    header {
      text-align: center;
      animation: fadeIn 0.8s var(--ease) forwards;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: -0.04em;
      color: var(--text);
    }

    .ip-display {
      margin-top: 0.35rem;
      font-family: "SFMono-Regular", Consolas, Menlo, monospace;
      font-size: 0.7rem;
      color: var(--gray);
      letter-spacing: 0.08em;
    }

    /* PYROXX */
    main {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 1s var(--ease) forwards;
    }

    .menu-bar {
      display: flex;
      gap: 0.75rem;
      width: 100%;
      justify-content: center;
    }

    .btn {
      appearance: none;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.65rem 1.25rem;
      min-width: 110px;
      font-family: "SFMono-Regular", Consolas, Menlo, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.35s var(--ease);
    }

    .btn:hover,
    .btn.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .btn-submit {
      width: 100%;
      margin-top: 0.25rem;
    }

    /* 3*/
    .panel {
      width: 100%;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateY(-6px);
      transition: max-height 0.55s var(--ease), opacity 0.45s var(--ease), transform 0.45s var(--ease), margin-top 0.45s var(--ease);
    }

    .panel.open {
      max-height: 280px;
      opacity: 1;
      transform: translateY(0);
      margin-top: 1.5rem;
    }

    .panel-box {
      border: 1px solid var(--border);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
    }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 0.75rem;
      font-size: 0.8rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.3s var(--ease);
    }

    input:focus {
      border-color: var(--border-active);
    }

    input::placeholder {
      color: var(--muted);
    }

    /* SUT */
    .baal-info {
      display: none;
      flex-direction: column;
      gap: 0.4rem;
      padding-top: 0.5rem;
      font-family: "SFMono-Regular", Consolas, Menlo, monospace;
      animation: fadeIn 0.4s var(--ease) forwards;
    }

    .baal-info.visible {
      display: flex;
    }

    .baal-msg {
      font-size: 0.72rem;
      color: var(--text);
    }

    .etc-addr {
      font-size: 0.68rem;
      color: var(--gray);
      word-break: break-all;
      user-select: all;
    }

    /* X */
    footer {
      display: flex;
      gap: 1.5rem;
      font-family: "SFMono-Regular", Consolas, Menlo, monospace;
      font-size: 0.72rem;
      animation: fadeIn 1.2s var(--ease) forwards;
    }

    footer a {
      color: var(--gray);
      text-decoration: none;
      transition: color 0.3s var(--ease);
    }

    footer a:hover {
      color: var(--text);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- D -->
  <header>
    <div class="brand">pyroinc.</div>
    <div id="userIp" class="ip-display">...</div>
  </header>

  <!-- S D -->
  <main>
    <div class="menu-bar">
      <button type="button" id="toggleApply" class="btn">APPLY</button>
      <button type="button" id="toggleBaal" class="btn">BAAL</button>
    </div>

    <!-- F F -->
    <div id="panelApply" class="panel">
      <form id="hireForm" class="panel-box" autocomplete="off">
        <input
          type="text"
          id="statement"
          placeholder="Why should we hire you?"
          required
        />
        <div class="row">
          <input
            type="text"
            id="username"
            placeholder="Username"
            required
          />
          <input
            type="email"
            id="email"
            placeholder="Email"
            required
          />
        </div>
        <button type="submit" class="btn btn-submit">SEND</button>
      </form>
    </div>


    <div id="panelBaal" class="panel">
      <div class="panel-box">
        <button type="button" id="registerBaalBtn" class="btn btn-submit">REGISTER</button>
        <div id="baalInfo" class="baal-info">
          <div class="baal-msg">This browser is registered to PYRO.baal</div>
          <div id="etcAddress" class="etc-addr"></div>
        </div>
      </div>
    </div>
  </main>


  <footer>
    <a href="mailto:business@pyrollc.com.tr">business@pyrollc.com.tr</a>
    <a href="mailto:god@pyrollc.com.tr">god@pyrollc.com.tr</a>
  </footer>

  <script>

    fetch('https://api.ipify.org?format=json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('userIp').textContent = data.ip;
      })
      .catch(() => {
        document.getElementById('userIp').textContent = '127.0.0.1';
      });


    const toggleApply = document.getElementById('toggleApply');
    const toggleBaal = document.getElementById('toggleBaal');
    const panelApply = document.getElementById('panelApply');
    const panelBaal = document.getElementById('panelBaal');

    toggleApply.addEventListener('click', () => {
      const isOpen = panelApply.classList.contains('open');
      panelBaal.classList.remove('open');
      toggleBaal.classList.remove('active');
      panelApply.classList.toggle('open', !isOpen);
      toggleApply.classList.toggle('active', !isOpen);
    });

    toggleBaal.addEventListener('click', () => {
      const isOpen = panelBaal.classList.contains('open');
      panelApply.classList.remove('open');
      toggleApply.classList.remove('active');
      panelBaal.classList.toggle('open', !isOpen);
      toggleBaal.classList.toggle('active', !isOpen);
    });

    // 3. Hire Form -> Send Template to business@pyrollc.com.tr
    document.getElementById('hireForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const statement = document.getElementById('statement').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();

      const subject = encodeURIComponent(`pyroinc. // ${username}`);
      const body = encodeURIComponent(
`WHY SHOULD WE HIRE YOU:
${statement}

USERNAME: ${username}
EMAIL: ${email}`
      );

      window.location.href = `mailto:business@pyrollc.com.tr?subject=${subject}&body=${body}`;
    });

    const registerBaalBtn = document.getElementById('registerBaalBtn');
    const baalInfo = document.getElementById('baalInfo');
    const etcAddress = document.getElementById('etcAddress');

    function generateEtcAddress() {
      const bytes = new Uint8Array(20);
      window.crypto.getRandomValues(bytes);
      return '0x' + Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
    }

    registerBaalBtn.addEventListener('click', () => {
      etcAddress.textContent = generateEtcAddress();
      baalInfo.classList.add('visible');
      registerBaalBtn.textContent = 'DONE';
      registerBaalBtn.disabled = true;
    });
  </script>
</body>
</html>
